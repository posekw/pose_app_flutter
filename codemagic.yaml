definitions:
  scripts:
    - &clean_and_setup
      name: Clean and Setup Environment
      script: |
        echo "=== STEP 1: Deep Clean - DerivedData & Caches ==="
        rm -rf ~/Library/Developer/Xcode/DerivedData
        rm -rf ~/Library/Caches/CocoaPods
        rm -rf ~/Library/Developer/Xcode/Archives
        
        echo "=== STEP 2: Installing Latest CocoaPods ==="
        sudo gem install cocoapods
        pod --version
        
        echo "=== STEP 3: Flutter Deep Clean ==="
        flutter clean
        rm -rf ios/build
        rm -rf ios/.symlinks
        rm -rf ios/Pods
        rm -rf ios/Podfile.lock
        rm -rf build
        
        echo "=== STEP 4: Get Packages ==="
        flutter pub get
        
        echo "=== STEP 5: Pod Install with Repo Update ==="
        cd ios
        pod repo update
        pod install --repo-update
        cd ..
        
        echo "=== Environment Ready! ==="

workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.posekw.gallery
      flutter: stable
      xcode: latest
      cocoapods: 1.16.2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios
          include: true
        - pattern: main
          include: true
    scripts:
      - *clean_and_setup
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          echo "=== Building IPA in RELEASE mode ==="
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
          echo "=== Build Complete! ==="
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - c.ronaldo-mut@hotmail.com
        notify:
          success: true
          failure: true

  android-build:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: android
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Get Packages
        script: flutter pub get
      - name: Build Android APK
        script: |
          echo "=== Building APK in RELEASE mode ==="
          flutter build apk --release
          echo "=== Build Complete! ==="
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - c.ronaldo-mut@hotmail.com
        notify:
          success: true
          failure: true
